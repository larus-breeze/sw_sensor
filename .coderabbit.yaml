# CodeRabbit review settings (larus-breeze/sw_tools#45).
# Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: chill
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # vendored or generated by STM32CubeMX
    - "!sw_stm32/Drivers/CMSIS/**"
    - "!sw_stm32/Drivers/STM32F4xx_HAL_Driver/**"
    - "!sw_stm32/Middlewares/**"
    - "!sw_stm32/Tracealyzer/**"
    - "!**/*.elf"
    - "!**/*.bin"
    - "!**/*.a"
  path_instructions:
    - path: "sw_stm32/**"
      instructions: >-
        STM32F407 (Cortex-M4F) firmware under FreeRTOS. Most tasks run
        unprivileged with MPU regions: data shared between tasks must be in a
        region the task can access (COMMON or the task's own regions). No
        dynamic memory allocation. Interrupt handlers may only use the
        FromISR APIs. Look for data races between tasks of different
        priorities. Flash and RAM are nearly full, so point out avoidable
        growth. Prefer float over double; watch for implicit promotions.
    - path: "sw_stm32/Communication/**"
      instructions: >-
        The CAN, NMEA and LRSX formats and the EEPROM layout are interfaces,
        specified in larus-breeze/doc_larus. Flag any change to them; it needs
        a specification change there first.
    - path: "sw_esp32/**"
      instructions: >-
        ESP32 WiFi companion (Arduino-ESP32 core, see the version in
        .github/workflows). The web UI talks to the STM32 over the WLAN link
        protocol in sw_stm32/Communication/wlan_link_protocol.*; both sides
        must stay compatible.
    - path: "configuration/**"
      instructions: >-
        u-blox receiver configuration files and the sensor configuration
        template. The GNSS driver (sw_stm32/Communication/GNSS_driver.cpp)
        expects the receiver on UART1 at 115200 baud with the UBX messages
        listed in configuration/README.md; flag settings that don't match.
    - path: ".github/workflows/**"
      instructions: >-
        Pull requests from forks must never run with secrets or with the
        private STM32CubeIDE image. Keep the toolchain versions pinned.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
