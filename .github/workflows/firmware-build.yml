name: Firmware build

# Test builds of the STM32 and ESP32 firmware, with memory usage and warnings.
# The STM32 firmware is built with STM32CubeIDE (build_firmware.py) in the
# private image of release-build.yml, if the variable CUBEIDE_CI is "true" and
# the code comes from this repository. Otherwise (forks, pull requests from
# forks) with the Arm GNU Toolchain (ci_build.py, settings from .cproject),
# file names marked "-armgnu". The images are named after the commit, like
# GIT_COMMIT_HASH in the firmware. Release images come from release-build.yml.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stm32-cubeide:
    name: STM32 (STM32CubeIDE)
    if: >-
      vars.CUBEIDE_CI == 'true' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ vars.CUBEIDE_IMAGE || 'ghcr.io/larus-breeze/stm32cubeide:2.2.0' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # the version header needs the tags

      - name: Build with STM32CubeIDE and pack the SD-card update image
        run: |
          git config --global --add safe.directory '*'
          status=0
          python3 sw_stm32/scripts/build_firmware.py 2>&1 | tee build.log || status=$?
          [ -f sw_stm32/Release/sw_sensor.elf ] && python3 sw_stm32/scripts/ci_summary.py from-build sw_stm32/Release/sw_sensor.elf build.log --json summary.json
          exit $status

      - name: Build the PR's base for comparison
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          git -C ../base submodule update --init
          cp sw_stm32/scripts/build_firmware.py sw_stm32/scripts/ci_build.py sw_stm32/scripts/ci_summary.py ../base/sw_stm32/scripts/
          python3 ../base/sw_stm32/scripts/build_firmware.py --no-pack > base.log 2>&1 || { tail -50 base.log; exit 1; }
          python3 ../base/sw_stm32/scripts/ci_summary.py from-build ../base/sw_stm32/Release/sw_sensor.elf base.log --json base.json

      - name: Summary
        if: always()
        run: python3 sw_stm32/scripts/ci_summary.py markdown summary.json base.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the images after the commit
        id: images
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/name-images.sh stm32 ""

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: larus_sensor-${{ steps.images.outputs.sha }}-stm32
          path: |
            images/
            sw_stm32/Release/sw_sensor.map
            build.log
            summary.json
            base.json

  stm32:
    name: STM32 (${{ matrix.label }})
    if: >-
      vars.CUBEIDE_CI != 'true' || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream of the release toolchain (CubeIDE 2.2.0, see #258)
          - label: GCC 14.3, as in CubeIDE 2.2.0
            version: 14.3.rel1
            sha256: 8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # create-git-info-header.py needs the tags

      - name: Cache Arm GNU Toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ matrix.version }}-x86_64

      - name: Install Arm GNU Toolchain ${{ matrix.version }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          archive=arm-gnu-toolchain-${{ matrix.version }}-x86_64-arm-none-eabi.tar.xz
          curl -sSfL -o $archive "https://developer.arm.com/-/media/Files/downloads/gnu/${{ matrix.version }}/binrel/$archive"
          echo "${{ matrix.sha256 }}  $archive" | sha256sum -c
          mkdir -p ~/arm-gnu-toolchain
          tar xf $archive -C ~/arm-gnu-toolchain --strip-components=1

      - name: Build
        run: |
          echo "$HOME/arm-gnu-toolchain/bin" >> $GITHUB_PATH
          export PATH="$HOME/arm-gnu-toolchain/bin:$PATH"
          # pack.py takes the ELF from Release/
          python3 sw_stm32/scripts/ci_build.py --build-dir "$PWD/sw_stm32/Release" --json summary.json --fail-usage FLASH=100 --fail-usage RAM=100
          pip install -r sw_stm32/scripts/requirements.txt
          python3 sw_stm32/scripts/pack.py

      - name: Build the PR's base for comparison
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          git -C ../base submodule update --init
          cp sw_stm32/scripts/ci_build.py ../base/sw_stm32/scripts/ci_build.py # base may predate the script
          python3 ../base/sw_stm32/scripts/ci_build.py --json base.json > base.log 2>&1 || cat base.log

      - name: Summary
        if: always()
        run: python3 sw_stm32/scripts/ci_summary.py markdown summary.json base.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the images after the commit
        id: images
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/name-images.sh stm32 -armgnu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: larus_sensor-${{ steps.images.outputs.sha }}-stm32
          path: |
            images/
            sw_stm32/Release/sw_sensor.map
            sw_stm32/Release/compile.log
            summary.json
            base.json

  esp32:
    name: ESP32 (esp32:esp32 ${{ matrix.core }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        core: ['3.3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
          pip install esptool

      - name: Build
        run: cd sw_esp32 && python3 scripts/build_firmware.py 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: |
          {
            echo "### ESP32 firmware: esp32:esp32 ${{ matrix.core }}"
            grep -E "Sketch uses|Global variables use" sw_esp32/build.log || echo "no size information"
            echo
            echo "Warnings in the sketch:"
            grep -E "wlan_link/.*warning" sw_esp32/build.log || echo "none"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the images after the commit
        id: images
        if: always()
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/name-images.sh esp32 ""

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: larus_sensor-${{ steps.images.outputs.sha }}-esp32
          path: |
            images/
            sw_esp32/build.log
