name: Release build (STM32CubeIDE)

# Builds the firmware with STM32CubeIDE itself (headless build_firmware.py) in a
# private container image - see ci/cubeide/README.md. Pull requests are checked
# by firmware-build.yml instead; forks can't pull the private image.

on:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  cubeide:
    if: github.repository == 'larus-breeze/sw_sensor'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/larus-breeze/stm32cubeide:2.2.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # the version header needs the tags

      - name: Build with STM32CubeIDE and pack the SD-card update image
        run: |
          git config --global --add safe.directory '*'
          python3 sw_stm32/scripts/build_firmware.py 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob
          from elftools.elf.elffile import ELFFile
          print("### STM32CubeIDE release build\n")
          for elf in glob.glob("build/*.elf"):
              with open(elf, "rb") as f:
                  comment = ELFFile(f).get_section_by_name(".comment").data().split(b"\0")[0].decode()
              print(f"- `{elf}`: {comment}")
          for name in sorted(glob.glob("build/*.bin")):
              print(f"- `{name}`")
          PY
          grep -E "Build Finished|Build Failed" build.log | tee -a "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stm32-release-${{ github.ref_name }}
          path: |
            build/*.elf
            build/*.bin
            sw_stm32/Release/sw_sensor.map
            build.log
